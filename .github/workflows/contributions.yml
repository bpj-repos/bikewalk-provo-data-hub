name: Contributor checks
on: pull_request
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install ./pipelines/crashes
      - run: python -m scripts.build_demo_counts build build/demo
      - run: python -m scripts.build_demo_counts validate build/demo
      - run: python -m unittest discover -v -s tests/hub -t .
      - run: PYTHONPATH=.:pipelines/crashes/src python -m unittest discover -v -s tests/crashes -t .
  city-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r pipelines/crashes/requirements-city.txt
      - run: PYTHONPATH=.:pipelines/crashes/src python -m unittest -v tests.crashes.test_city_mapping
