name: Monthly Safe Routes source review
on:
  schedule:
    - cron: '41 14 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore reviewed archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download source-receipts-safe-routes-20261107 -p safe-routes-july.tar.gz
          echo '82073f45eb74cf9b5e68777e03fdd26f506e63ad8967bc9d7401a93560e69354  safe-routes-july.tar.gz' | sha256sum -c
          tar xzf safe-routes-july.tar.gz
      - name: Prepare private candidate and review changes
        run: |
          mkdir -p private
          date -u +%FT%TZ > private/attempt.txt
          python3 -m scripts.safe_routes receive private/receipt udot-safe-routes-to-school-785cfb00279ee95b
          python3 -m scripts.safe_routes prepare private/receipt private/candidate --version "review-${GITHUB_RUN_ID}"
          python3 -m scripts.review_campus private/receipt > private/treeside-review.json
          cat private/treeside-review.json >> "$GITHUB_STEP_SUMMARY"
          python3 -m scripts.review_routes private/candidate > private/review.json
          cat private/review.json >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare bicycle stress annotations from pinned receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install shapely==2.1.2 pyproj==3.7.2
          gh release download source-receipts-safe-routes-stress-20261109 -p stress-network.tar.gz
          echo 'a167a84a9893366a92c41d06bc988ec50b9c5ed5a92455ee38aee7eea9b58333  stress-network.tar.gz' | sha256sum -c
          mkdir -p private/stress-inputs
          tar xzf stress-network.tar.gz -C private/stress-inputs
          python3 -m scripts.route_stress private/candidate private/stress-inputs/neighborhood_ways.geojson private/stress-inputs/neighborhood_ways_intersections.geojson private/stress-inputs/utah-bikeways.geojson.gz private/stress
          python3 -m scripts.package_stress private/candidate private/stress private/combined --version "review-${GITHUB_RUN_ID}"
          cat private/combined/stress-coverage.json >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned stress inputs: OSM 2026-11-07 / Utah 2026-10-09. Review provider updates and changed routes before promotion." >> "$GITHUB_STEP_SUMMARY"
      - name: Review additional campuses and boundary crossings
        run: |
          python3 -m pip install shapely==2.1.2
          python3 -m scripts.audit_coverage > private/coverage-review.txt
          date -u +%FT%TZ > private/success.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-routes-review-${{ github.run_id }}
          path: private/
          retention-days: 30

