name: Monthly Safe Routes source review
on:
  schedule:
    - cron: '41 14 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safe-routes-source-review
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - name: Acquire providers, run Brokenspoke and prepare candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.refresh_route_sources private/refresh
          mkdir private/rebuild
          python -m scripts.rebuild_route_candidate private/refresh private/rebuild
          python -m scripts.route_refresh_summary private/refresh "$GITHUB_RUN_ID" | tee private/refresh/review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: safe-routes-review-${{ github.run_id }}
          path: |
            private/refresh/review.md
            private/refresh/review.json
            private/refresh/changes.json
            private/refresh/unrated-review.json
            private/refresh/published-comparison.json
            private/refresh/campus.json
            private/refresh/school-coverage-review.txt
            private/refresh/inputs/
            private/refresh/receipt/
            private/refresh/package/
          retention-days: 30
