version: 2
scope: Source-qualified active-transportation derivations; no cross-source identity
  decisions.
references:
- dictionary2021
- codes2021
- rollups2021
- tables2021
completeness: AT serious/fatal is false only with at least one identified AT person,
  a known injury category for every identified AT person, and no unclassified exported
  person. Positive documented serious/fatal injury remains true when other inputs
  are partial. Never substitute crash totals.
