    target: vehicle.body_type
    type: category
  vehicle.maneuver:
    disposition: keep
    target: vehicle.maneuver
    type: category
  vehicle.most_harmful_event:
    disposition: keep
    target: vehicle.most_harmful_event
    type: category
  vehicle.special_function:
    disposition: keep
    target: vehicle.special_function
    type: category
