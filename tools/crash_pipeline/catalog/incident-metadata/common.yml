  person.type:
    disposition: keep
    target: person.type
    type: category
  provider.error_code:
    disposition: exclude
    group: unresolved-or-empty
    reason: Entire retained column is null and its meaning is undocumented. Preserve
      in raw data, review if future values appear.
  provider.police_unused:
    disposition: exclude
    group: unresolved-or-empty
    reason: Entire headerless fifth column is empty; no supplied semantic definition.
  road.exit_number:
    disposition: exclude
    group: low-priority
    reason: Exit locator is low priority for the initial street-focused analysis;
      road, route, milepoint and point remain.
  road.functional_class:
    disposition: keep
    target: road.functional_class
    type: category
  road.horizontal_alignment:
    disposition: keep
    target: road.horizontal_alignment
    type: category
  road.junction:
    disposition: keep
    target: road.junction
    type: category
  road.jurisdiction:
    disposition: keep
    target: road.jurisdiction
    type: category
  road.milepoint:
    disposition: keep
    target: road.milepoint
    type: number
  road.pavement_type:
    disposition: keep
    target: road.pavement_type
    type: category
  road.provider_type:
    disposition: exclude
    group: unresolved-or-empty
    reason: Roadway type codes lack a verified definition. Hold outside normalized
      analysis until clarified.
  road.ramp_id:
    disposition: exclude
    group: low-priority
    reason: Ramp identifier is low priority initially. Junction and vehicle maneuver
      retain ramp context, but not this exact identifier.
  road.route_direction:
    disposition: keep
    target: road.route_direction
    type: category
  road.route_number:
    disposition: keep
    target: road.route_number
    type: text
  road.udot_region:
    disposition: exclude
    group: low-priority
    reason: Broad administrative region adds little to the current local analysis.
  road.urban_rural:
    disposition: keep
    target: road.urban_rural
    type: category
  road.vertical_alignment:
    disposition: keep
    target: road.vertical_alignment
    type: category
  source.current_through:
    disposition: provenance
    target: source.current_through
    type: temporal
    reason: Provider currency belongs to source/partition provenance; preserve differing
      values instead of claiming a single global date.
  time.holiday:
    disposition: exclude
    group: low-priority
    reason: Provider holiday label is not needed initially; exact source date remains
      available for later calendar analysis.
  time.minutes_after_midnight:
    disposition: exclude
    group: unresolved-or-empty
    reason: Undocumented helper; time-of-day can be queried from the occurrence clock
      without adopting this helper.
  time.occurred_at:
    disposition: keep
    target: time.occurred_at
    type: temporal
  time.occurrence_date:
    disposition: query
    target: time.occurred_at.date
    type: date
    reason: Query the date from the temporal structure; compare the supplied helper
      date and flag disagreements instead of retaining a duplicate date field.
  time.reported_at:
    disposition: keep
    target: time.reported_at
    type: temporal
  travel.police_mode:
    disposition: keep
    target: travel.police_mode
    type: text
  vehicle.body_type:
