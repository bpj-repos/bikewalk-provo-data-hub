    disposition: keep
    target: location.geographic_city
    type: category
  location.latitude:
    disposition: component
    target: location.point
    type: number
    reason: Build one WGS84 point from latitude/y and longitude/x; do not retain a
      second coordinate representation in analytical records.
  location.longitude:
    disposition: component
    target: location.point
    type: number
    reason: Build one WGS84 point from latitude/y and longitude/x; do not retain a
      second coordinate representation in analytical records.
  location.point:
    disposition: keep
    target: location.point
    type: point
  location.police_description:
    disposition: keep
    target: location.police_description
    type: text
  location.road_name:
    disposition: keep
    target: location.road_name
    type: text
  location.utm_easting:
    disposition: exclude
    group: redundant-coordinate
    reason: Use delivered WGS84 point once. Original projected attributes stay in
      raw inputs. Verify empirical EPSG:3857 agreement; their UTM name/layer geometry
      CRS does not establish attribute CRS.
  location.utm_northing:
    disposition: exclude
    group: redundant-coordinate
    reason: Use delivered WGS84 point once. Original projected attributes stay in
      raw inputs. Verify empirical EPSG:3857 agreement; their UTM name/layer geometry
      CRS does not establish attribute CRS.
