conceptRelations:
- from: identity.local_case_number
  to: identity.state_crash_id
  relationship: unresolved
  reason: Different issuing authorities. No authoritative crosswalk is present.
- from: time.reported_at
  to: time.occurred_at
  relationship: related
  reason: Report time can differ from occurrence time. The headerless police delivery is additionally ambiguous.
- from: location.police_description
  to: location.description
  relationship: related
  reason: Both describe location, but police annotations and geocoding inputs have different semantics from state
    location descriptions.
- from: travel.police_mode
  to: person.type
  relationship: related
  reason: Police mode can distinguish e-bike or scooter. Person type may combine several devices and is person-grained.
- from: person.type
  to: classification.bicycle_involved
  relationship: derived
  reason: A source-defined crash rollup can be derived from person roles. The exact rule depends on source version.
- from: person.type
  to: classification.pedestrian_involved
  relationship: derived
  reason: A source-defined crash rollup can aggregate pedestrian and conveyance roles. Preserve the rule version.
- from: injury.crash_severity
  to: person.injury_severity
  relationship: derived
  reason: Crash severity summarizes the highest applicable person injury level. Person rows retain individual outcomes.
- from: location.point
  to: location.latitude
  relationship: component
  reason: Latitude is one component of the WGS84 point.
- from: location.point
  to: location.longitude
  relationship: component
  reason: Longitude is one component of the WGS84 point.
- from: event.first_harmful
  to: vehicle.most_harmful_event
  relationship: related
  reason: First event is crash-grained. Most harmful event is vehicle-grained and can describe a different event.
- from: time.occurred_at
  to: time.occurrence_date
  relationship: component
  reason: Date component must retain the occurrence timezone and precision.
- from: count.fatalities
  to: person.injury_severity
  relationship: derived
  reason: Source-specific count of eligible people in the corresponding injury category, grouped by source crash
    ID.
- from: count.serious_injuries
  to: person.injury_severity
  relationship: derived
  reason: Source-specific count of eligible people in the corresponding injury category, grouped by source crash
    ID.
- from: count.minor_injuries
  to: person.injury_severity
  relationship: derived
  reason: Source-specific count of eligible people in the corresponding injury category, grouped by source crash
    ID.
- from: count.possible_injuries
  to: person.injury_severity
  relationship: derived
  reason: Source-specific count of eligible people in the corresponding injury category, grouped by source crash
    ID.
- from: count.no_apparent_injury
  to: person.injury_severity
  relationship: derived
  reason: Source-specific count of eligible people in the corresponding injury category, grouped by source crash
    ID.
- from: location.utm_easting
  to: location.point
  relationship: derived
  reason: Retained projected X/Y attributes empirically match EPSG:3857 when transformed to the WGS84 point; provider
    confirmation is absent. Neither UTM component is a latitude/longitude degree value.
- from: location.utm_northing
  to: location.point
  relationship: derived
  reason: Retained projected X/Y attributes empirically match EPSG:3857 when transformed to the WGS84 point; provider
    confirmation is absent. Neither UTM component is a latitude/longitude degree value.
knownGaps:
- source: police
  fields:
  - event_type
  - severity
  - occurrence_timestamp
  reason: Not delivered as dedicated workbook columns. Report time semantics need confirmation.
- source: portal.persons
  fields:
  - nonmotorist_device_type
  - device_motorization
  - nonmotorist_action
  - nonmotorist_safety_equipment
  reason: Defined in the 2026 manual but absent from the retained person export.
- source: portal.vehicles
  fields:
  - travel_direction
  - estimated_speed
  - traffic_control_device
  - event_sequence_1
  - event_sequence_2
  - event_sequence_3
  - event_sequence_4
  reason: Described in guides but absent from the retained vehicle export.
- source: state exports
  fields:
  - local_police_case_number
  - narrative
  - diagram
  reason: Absent from the retained exports. Access and crosswalk work remain deferred.
- source: portal.persons
  fields:
  - person_number
  reason: No person identifier is exported. vehicleNumber identifies a vehicle unit, not a person. Preserve row
    provenance.
